# Non-secret agent-server config: AWS region + per-agent Bedrock model ids.
# The agent-server (Helm) injects these as env via extraEnv. AWS credentials stay
# in the app-secrets Secret, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  REGION_NAME: us-east-1 
  TRAFFIC_AGENT_MODEL: us.anthropic.claude-opus-4-6-v1
  PATCH_AGENT_MODEL: us.anthropic.claude-opus-4-6-v1
  EXPLOIT_AGENT_MODEL: us.anthropic.claude-opus-4-6-v1
  ROUTER_AGENT_MODEL: us.anthropic.claude-haiku-4-5-20251001-v1:0
  CHAT_AGENT_MODEL: us.anthropic.claude-haiku-4-5-20251001-v1:0
  SYNTHESIS_MODEL: us.anthropic.claude-haiku-4-5-20251001-v1:0
  # Shared cap on aggregate Bedrock requests/second (every agent shares one
  # limiter) -> smooths the all-services fan-out burst that throttles Bedrock.
  # These pods run Opus (lower Bedrock quota than local Sonnet): lower if needed.
  BEDROCK_MAX_RPS: "4"
