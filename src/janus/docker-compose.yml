services:
  janus-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: janus-mcp
    env_file: .env
    ports:
      # exposed on localhost for local development. Agents running in the
      # same Docker network can reach the MCP at http://janus-mcp:8765/mcp.
      - "127.0.0.1:${MCP_PORT:-8765}:${MCP_PORT:-8765}"
    networks:
      - janus-net
    restart: unless-stopped

networks:
  # use the default network that Janus is on, so we can reach it at http://janus:8080 without extra config
  # the name of it may change depending on how you run Janus
  janus-net:
    name: ${JANUS_NETWORK:-janus_default}
    external: true
