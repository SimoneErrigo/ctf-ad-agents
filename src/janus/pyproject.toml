[project]
name = "janus-mcp"
version = "0.1.0"
description = "MCP server that wraps the Janus REST API for CTF A/D agents."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Simone Errigo", email = "simone.errigo@mail.polimi.it" }]

dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus_mcp"]
