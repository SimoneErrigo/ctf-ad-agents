[project]
name = "ctf-ad-agents"
version = "0.1.0"
description = "Agentic AI system providing support for teams in a capture the flag attack&defense competition"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.1",
    "langchain-aws>=1.4.7",
    "langchain-mcp-adapters>=0.2.2",
    "langgraph>=1.2.0",
    "langsmith>=0.8.5",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
# `langgraph dev` (in-memory Agent Server) for local dev + Agent Chat UI.
dev = ["langgraph-cli[inmem]", "pytest>=8"]
